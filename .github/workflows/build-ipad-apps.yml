name: Build Complete 13-App iPadOS .ipa Suite

on:
  push:
    branches: [ main ]
    paths:
      - 'ios-wrapper/**'
      - '.github/workflows/build-ipad-apps.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build ${{ matrix.app_name }} (.ipa)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: photocraft,  app_name: PhotoCraft,  bundle_id: com.craftsuite.photocraft }
          - { id: vectorcraft, app_name: VectorCraft, bundle_id: com.craftsuite.vectorcraft }
          - { id: designcraft, app_name: DesignCraft, bundle_id: com.craftsuite.designcraft }
          - { id: lightcraft,  app_name: LightCraft,  bundle_id: com.craftsuite.lightcraft }
          - { id: filmcraft,   app_name: FilmCraft,   bundle_id: com.craftsuite.filmcraft }
          - { id: effectcraft, app_name: EffectCraft, bundle_id: com.craftsuite.effectcraft }
          - { id: figcraft,    app_name: FigCraft,    bundle_id: com.craftsuite.figcraft }
          - { id: wordcraft,   app_name: WordCraft,   bundle_id: com.craftsuite.wordcraft }
          - { id: gridcraft,   app_name: GridCraft,   bundle_id: com.craftsuite.gridcraft }
          - { id: deckcraft,   app_name: DeckCraft,   bundle_id: com.craftsuite.deckcraft }
          - { id: pdfcraft,    app_name: PdfCraft,    bundle_id: com.craftsuite.pdfcraft }
          - { id: soundcraft,  app_name: SoundCraft,  bundle_id: com.craftsuite.soundcraft }
          - { id: cadcraft,    app_name: CADCraft,    bundle_id: com.craftsuite.cadcraft }

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch WebAssembly Bundle (storytold/${{ matrix.id }})
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          rm -rf ios-wrapper/www
          mkdir -p ios-wrapper/www

          REPO="storytold/${{ matrix.id }}"
          ASSET_NAME=$(gh release view --repo "$REPO" --json assets --jq '.assets[].name' | grep -iE 'web.*\.zip$' | head -n 1)
          echo "Downloading $ASSET_NAME from $REPO..."
          gh release download --repo "$REPO" --pattern "$ASSET_NAME" --dir /tmp/web-release
          mkdir -p /tmp/web-extracted
          unzip -q "/tmp/web-release/$ASSET_NAME" -d /tmp/web-extracted
          INDEX_FILE=$(find /tmp/web-extracted -name "index.html" | head -n 1)
          BUNDLE_DIR=$(dirname "$INDEX_FILE")
          cp -R "$BUNDLE_DIR"/. ios-wrapper/www/

          if [ -d "ios-wrapper/www/app" ] && [ -d "ios-wrapper/www/snippets" ]; then
            cp -R ios-wrapper/www/snippets ios-wrapper/www/app/snippets
          fi
          rm -f ios-wrapper/www/.htaccess

      - name: Format Official 1024x1024 App Icon for ${{ matrix.app_name }}
        run: |
          ICON_SET="ios-wrapper/Sources/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_SET"
          curl -LsSf "https://raw.githubusercontent.com/storytold/${{ matrix.id }}/main/assets/app-icon/${{ matrix.id }}-1024.png" -o /tmp/raw-icon.png

          pip3 install --quiet --break-system-packages Pillow
          python3 - << 'PYEOF'
          from PIL import Image
          img = Image.open("/tmp/raw-icon.png").convert("RGBA")
          w, h = img.size
          px = img.load()
          min_x, min_y, max_x, max_y = w, h, 0, 0
          for y in range(0, h, 2):
              for x in range(0, w, 2):
                  if px[x, y][3] > 200:
                      if x < min_x: min_x = x
                      if y < min_y: min_y = y
                      if x > max_x: max_x = x
                      if y > max_y: max_y = y
          if max_x <= min_x or max_y <= min_y:
              min_x, min_y, max_x, max_y = 0, 0, w - 1, h - 1
          sample = px[w // 2, min(h - 1, min_y + 25)]
          bg_rgb = (sample[0], sample[1], sample[2]) if sample[3] > 200 else (30, 41, 59)
          cropped = img.crop((min_x, min_y, max_x + 1, max_y + 1)).resize((1024, 1024), Image.Resampling.LANCZOS)
          bg = Image.new("RGBA", (1024, 1024), (*bg_rgb, 255))
          bg.alpha_composite(cropped)
          bg.convert("RGB").save("ios-wrapper/Sources/Assets.xcassets/AppIcon.appiconset/AppIcon.png", "PNG")
          PYEOF

          cat > "$ICON_SET/Contents.json" << 'EOF'
          {
            "images" : [
              {
                "filename" : "AppIcon.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF

      - name: Build Unsigned iPadOS .ipa with Xcode
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

          cd ios-wrapper
          xcodegen generate

          xcodebuild -project CraftiPadApp.xcodeproj \
            -scheme CraftiPadApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            APP_NAME="${{ matrix.app_name }}" \
            APP_DISPLAY_NAME="${{ matrix.app_name }}" \
            APP_BUNDLE_ID="${{ matrix.bundle_id }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

          mkdir -p Payload
          cp -R "build/Build/Products/Release-iphoneos/${{ matrix.app_name }}.app" Payload/
          zip -r -y "$GITHUB_WORKSPACE/${{ matrix.app_name }}-iPad.ipa" Payload

      - name: Upload ${{ matrix.app_name }}-iPad.ipa to GitHub Release v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v1.0.0 >/dev/null 2>&1; then
            gh release create v1.0.0 --title "ArtCraft Suite for iPadOS (All 13 Apps)" --notes "Complete 13-app iPadOS .ipa suite and live Web App Hub." || true
          fi
          gh release upload v1.0.0 "${{ matrix.app_name }}-iPad.ipa" --clobber

      - name: Upload ${{ matrix.app_name }}-iPad.ipa Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app_name }}-iPad-IPA
          path: ${{ matrix.app_name }}-iPad.ipa
          retention-days: 30
