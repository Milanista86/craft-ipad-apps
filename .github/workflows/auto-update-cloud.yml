name: Build & Auto-Update Complete 13-App Cloud Hub (GitHub Pages)

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/build_cloud_hub.py'
      - '.github/workflows/auto-update-cloud.yml'
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-cloud-suite:
    name: Build & Deploy All 13 ArtCraft Apps to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Install Python Pillow
        run: pip install --quiet Pillow

      - name: Build All 13 ArtCraft iPad Web Apps & Hub Page
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build_cloud_hub.py

      - name: Deploy to gh-pages branch
        run: |
          cd gh-pages-out
          git init
          git config core.autocrlf false
          git config user.name "ArtCraft iPad Builder"
          git config user.email "builder@local"
          git checkout -b gh-pages
          git add .
          git commit -m "Deploy complete 13-app ArtCraft Suite for iPadOS"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
